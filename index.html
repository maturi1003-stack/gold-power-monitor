
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GOLD POWER</title>
<style>
body{background:#101827;color:white;font-family:Arial,sans-serif;padding:15px;margin:0}
h1{text-align:center;color:#f5c542}
p{text-align:center;color:#bbb}
.panel{background:#202c40;padding:12px;border-radius:15px;margin:15px 0}
h2{font-size:18px}
</style>
</head>
<body>
<h1>GOLD POWER</h1>
<p>OANDA XAU/USD 市場分析</p>

<div class="panel">
<h2>現在の金価格</h2>
<div class="tradingview-widget-container">
<div class="tradingview-widget-container__widget"></div>
<script src="https://s3.tradingview.com/external-embedding/embed-widget-symbol-info.js" async>
{
"symbol":"OANDA:XAUUSD",
"width":"100%",
"locale":"ja",
"colorTheme":"dark",
"isTransparent":true
}
</script>
</div>
</div>

<div class="panel">
<h2>1分足 売買パワー</h2>
<div class="tradingview-widget-container">
<div class="tradingview-widget-container__widget"></div>
<script src="https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js" async>
{
"interval":"1m",
"width":"100%",
"height":400,
"symbol":"OANDA:XAUUSD",
"displayMode":"single",
"locale":"ja",
"colorTheme":"dark",
"showIntervalTabs":false
}
</script>
</div>
</div>

<div class="panel">
<h2>5分足 方向確認</h2>
<div class="tradingview-widget-container">
<div class="tradingview-widget-container__widget"></div>
<script src="https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js" async>
{
"interval":"5m",
"width":"100%",
"height":400,
"symbol":"OANDA:XAUUSD",
"displayMode":"single",
"locale":"ja",
"colorTheme":"dark",
"showIntervalTabs":false
}
</script>
</div>
</div>
<p>分析提供: TradingView</p>
</body>
</html>
